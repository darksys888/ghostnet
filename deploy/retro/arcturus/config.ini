# Arcturus production config — rendered at container start by entrypoint.sh
# via `envsubst`. ${...} placeholders pull from the docker-compose env block
# (which in turn is sourced from deploy/retro/.env).

runmode=plugin

# ── Database ─────────────────────────────────────────────────────
db.hostname=${DB_HOST}
db.port=${DB_PORT}
db.database=${DB_NAME}
db.username=${DB_USER}
db.password=${DB_PASSWORD}
db.params=?useSSL=false&allowPublicKeyRetrieval=true&autoReconnect=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC

# Connection pool sized for production traffic.
db.pool.minsize=10
db.pool.maxsize=50

# ── Game socket ──────────────────────────────────────────────────
game.host=0.0.0.0
game.tcp.port=3000

# ── Built-in webserver (camera + REST endpoints) ─────────────────
webserver.host=0.0.0.0
webserver.port=2096

# ── Misc ─────────────────────────────────────────────────────────
encryption.forced=0
io.input.idle.threshold=600
pong.disconnect=false
