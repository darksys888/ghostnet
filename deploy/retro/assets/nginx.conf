# Production asset server — serves .nitro bundles + gamedata to the Nitro
# client on a different origin. CORS-permissive, aggressive caching for
# binary assets, no-cache for the bootstrap configs.
server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # ── CORS ─────────────────────────────────────────────────────
    add_header Access-Control-Allow-Origin  *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Range";
    add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

    # Game assets are content-addressed in practice — cache for a year.
    location ~* \.(nitro|swf|png|jpe?g|gif|mp3|ogg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin  *;
    }

    # Game data (figuredata, productdata, externaltexts) DOES change between
    # deployments — short cache only.
    location ~* \.(json|xml|txt)$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin  *;
    }

    # Default: allow directory listing for ad-hoc inspection.
    location / {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Compression on the JSON / XML config files.
    gzip            on;
    gzip_types      application/json application/xml text/plain text/xml;
    gzip_min_length 1024;
}
