# Production Nitro client serve config.
server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # CORS — Nitro fetches assets from the assets server on a different origin.
    add_header Access-Control-Allow-Origin  *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept";

    # SPA fallback — deep links resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hash-named JS/CSS bundles are immutable → cache aggressively.
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Boot-time config files MUST be re-fetched fresh — no caching.
    location ~* \.(json|xml|txt)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Compression for text-y assets.
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript application/xml application/xml+rss text/xml;
    gzip_min_length 1024;
}
