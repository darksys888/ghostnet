name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ── Workspace quality gate ────────────────────────────────────
  check:
    name: format · lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull Holo5 submodules so any dependent typecheck has the source.
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Nx
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json', 'nx.json') }}
          restore-keys: nx-${{ runner.os }}-

      - name: Install workspace dependencies
        run: npm ci

      - name: Set Nx affected base
        run: echo "NX_BASE=origin/${{ github.event.pull_request.base.ref || 'main' }}" >> "$GITHUB_ENV"

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint, --max-warnings=0)
        run: npm run lint

      - name: Typecheck (every project)
        run: npx nx run-many --target=typecheck --parallel

  # ── @ghostnet/cdn build ───────────────────────────────────────
  cdn-build:
    name: build · @ghostnet/cdn
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx nx run cdn:build

  # ── Cypress: repo-structure invariants (no backend needed) ────
  e2e-structure:
    name: e2e · structure invariants
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Run Cypress (tests/structure)
        uses: cypress-io/github-action@v6
        with:
          working-directory: tests/structure
          install: false
          browser: chrome

  # ── Cypress: CDN security suite ───────────────────────────────
  # Builds the CDN, starts it, runs the 50-test security suite against it.
  e2e-cdn:
    name: e2e · @ghostnet/tests-cdn
    runs-on: ubuntu-latest
    needs: [check, cdn-build]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build the CDN
        run: npx nx run cdn:build

      - name: Cypress run with the CDN started in the background
        uses: cypress-io/github-action@v6
        env:
          CDN_PUBLIC_DIR: ${{ github.workspace }}/public
          CDN_LOG_LEVEL: warn
          CDN_ALLOW_LISTING: "true"
        with:
          working-directory: tests/cdn
          install: false
          start: node ${{ github.workspace }}/services/cdn/dist/index.js
          wait-on: "http://localhost:5500/icons/.gitkeep"
          wait-on-timeout: 60
          browser: chrome
