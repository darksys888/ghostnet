name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  check:
    name: format · lint · typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Pull Holo5 submodules so any dependent typecheck has the source.
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json', 'nx.json') }}
          restore-keys: nx-${{ runner.os }}-

      - name: Install workspace dependencies
        run: npm ci

      - name: Set Nx affected base
        run: echo "NX_BASE=origin/${{ github.event.pull_request.base.ref || 'main' }}" >> "$GITHUB_ENV"

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint, --max-warnings=0)
        run: npm run lint

      - name: Typecheck (every project)
        run: npx nx run-many --target=typecheck --parallel

  cdn-build:
    name: build · @ghostnet/cdn
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx nx run cdn:build
